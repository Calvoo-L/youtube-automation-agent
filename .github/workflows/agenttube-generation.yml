name: AgentTube generation (no upload)

on:
  schedule:
    # Weekly, Monday at 06:17 UTC. Edit only after checking model quotas and output storage.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Generate a long-form video or repurpose an existing production as Shorts
        type: choice
        options:
          - long-form
          - shorts
        default: long-form
        required: true
      topic:
        description: Topic for a long-form video (ignored for Shorts)
        type: string
        default: Practical AI and digital tools for learners and professionals aged 16+
        required: false
      production_id:
        description: Existing AgentTube production ID (required for Shorts)
        type: string
        required: false
      length:
        description: Long-form video length
        type: choice
        options:
          - short
          - medium
          - long
        default: medium
        required: true
      create_shorts:
        description: Also render three Shorts from the new long-form video
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: agenttube-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AGENTTUBE_GENERATION_ONLY: 'true'
      DEFAULT_PRIVACY_STATUS: private
      TARGET_AUDIENCE: Learners and professionals aged 16 and older interested in technology, artificial intelligence, and digital tools
      CHANNEL_NAME: Technology, AI and Digital Tools
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAX_CONCURRENT_JOBS: '1'
      ANONYMOUS_TELEMETRY_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore AgentTube database and media
        uses: actions/cache/restore@v4
        with:
          path: data
          key: agenttube-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            agenttube-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for video rendering
        run: npx playwright install --with-deps chromium

      - name: Generate draft content
        env:
          MODE: ${{ github.event_name == 'schedule' && 'long-form' || inputs.mode }}
          TOPIC: ${{ inputs.topic }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          VIDEO_LENGTH: ${{ inputs.length }}
          CREATE_SHORTS: ${{ github.event_name == 'schedule' && 'true' || inputs.create_shorts }}
        run: node .github/scripts/generate.cjs

      - name: Save AgentTube database and media
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: agenttube-state-${{ runner.os }}-${{ github.run_id }}

      - name: Keep generated files for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenttube-drafts-${{ github.run_number }}
          path: actions-output/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
